[project]
name = "news_headline_trading_heat_prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Laurenz Hammacher", email = "users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "fastapi>=0.143.2",
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
news_headline_trading_heat_prediction = "news_headline_trading_heat_prediction:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bs4>=0.0.2",
    "ipdb>=0.13.13",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "spacy>=3.8.16",
    "torch>=2.14.1",
    "yfinance>=1.7.0",
]
